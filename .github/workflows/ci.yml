name: LastFrame CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core
        run: cmake -S . -B build/core -G Ninja -DLASTFRAME_BUILD_UI=OFF -DLASTFRAME_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build core
        run: cmake --build build/core --parallel

      - name: Test core
        run: ctest --test-dir build/core --output-on-failure -C Release

  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    needs: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        id: qt-python
        with:
          python-version: '3.13'

      - name: Install Qt
        shell: pwsh
        env:
          QT_PYTHON: ${{ steps.qt-python.outputs.python-path }}
        run: |
          & $env:QT_PYTHON --version
          & $env:QT_PYTHON -m pip install --disable-pip-version-check --no-warn-script-location "aqtinstall==3.3.0" "py7zr==1.1.0"
          $qtRoot = Join-Path $env:RUNNER_WORKSPACE 'Qt'
          & $env:QT_PYTHON -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir $qtRoot
          $qtPrefix = Join-Path $qtRoot '6.8.3\msvc2022_64'
          "QT_ROOT_DIR=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake -S . -B build/windows -G Ninja Multi-Config -DLASTFRAME_BUILD_UI=ON -DLASTFRAME_BUILD_TESTS=ON -DLASTFRAME_BUILD_SMOKE=OFF

      - name: Build
        shell: pwsh
        run: |
          & cmake --build build/windows --config Release --parallel 2 --verbose 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LastFrame-windows-build-log
          path: build.log

      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'LastFrame-windows-x64-portable'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item build/windows/Release/LastFrame.exe $package
          windeployqt --release --no-translations --network build/windows/Release/LastFrame.exe --dir $package
          Copy-Item (Get-Command ffmpeg).Source $package
          Copy-Item (Get-Command ffprobe).Source $package
          Copy-Item LICENSE $package
          Copy-Item THIRD_PARTY_NOTICES.md $package
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath LastFrame-windows-x64-portable.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastFrame-windows-x64-portable
          path: LastFrame-windows-x64-portable.zip
