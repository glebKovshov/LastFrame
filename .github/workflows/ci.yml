name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure core
        run: cmake -S . -B build/core -DLASTFRAME_BUILD_UI=OFF -DLASTFRAME_BUILD_TESTS=ON
      - name: Build core
        run: cmake --build build/core --config Release
      - name: Test core
        run: ctest --test-dir build/core -C Release --output-on-failure

  windows-portable:
    name: Windows portable MVP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build/release -G "Ninja Multi-Config" -DLASTFRAME_BUILD_UI=ON -DLASTFRAME_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package portable directory
        shell: pwsh
        run: |
          cmake --install build/release --config Release --prefix out/LastFrame
          windeployqt --release --no-translations out/LastFrame/LastFrame.exe
          Compress-Archive -Path out/LastFrame/* -DestinationPath LastFrame-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LastFrame-windows-x64-portable
          path: LastFrame-windows-x64-portable.zip
