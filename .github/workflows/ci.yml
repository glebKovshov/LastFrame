name: LastFrame CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core
        run: cmake -S . -B build/core -G Ninja -DLASTFRAME_BUILD_UI=OFF -DLASTFRAME_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build core
        run: cmake --build build/core --parallel

      - name: Test core
        run: ctest --test-dir build/core --output-on-failure -C Release

  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    needs: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtnetwork
          cache: true

      - name: Configure
        run: cmake -S . -B build/windows -G Ninja Multi-Config -DLASTFRAME_BUILD_UI=ON -DLASTFRAME_BUILD_TESTS=ON -DLASTFRAME_BUILD_SMOKE=OFF

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'LastFrame-windows-x64-portable'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item build/windows/Release/LastFrame.exe $package
          windeployqt --release --no-translations --network build/windows/Release/LastFrame.exe --dir $package
          Copy-Item (Get-Command ffmpeg).Source $package
          Copy-Item (Get-Command ffprobe).Source $package
          Copy-Item LICENSE $package
          Copy-Item THIRD_PARTY_NOTICES.md $package
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath LastFrame-windows-x64-portable.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastFrame-windows-x64-portable
          path: LastFrame-windows-x64-portable.zip
